<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <rect width="1024" height="1024" fill="url(#grad1)"/>
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F2FAFA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FDFEFE;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2CA6A3;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#4FC3C0;stop-opacity:0.8" />
    </linearGradient>
  </defs>

  <!-- Decorative circles -->
  <circle cx="180" cy="180" r="120" fill="#2CA6A3" opacity="0.08"/>
  <circle cx="850" cy="750" r="150" fill="#4FC3C0" opacity="0.08"/>
  <circle cx="780" cy="220" r="80" fill="#6FE3DF" opacity="0.12"/>

  <!-- Main illustration -->
  <!-- Building/house icon -->
  <g transform="translate(312, 280)">
    <rect x="0" y="100" width="400" height="300" rx="12" fill="#142C4A" opacity="0.06"/>
    <rect x="20" y="120" width="360" height="260" rx="8" fill="white"/>
    <path d="M200 20 L380 120 L20 120 Z" fill="url(#grad2)"/>
    <circle cx="200" cy="90" r="8" fill="#FFFFFF"/>

    <!-- Windows -->
    <rect x="60" y="170" width="100" height="80" rx="6" fill="#2CA6A3" opacity="0.15"/>
    <rect x="240" y="170" width="100" height="80" rx="6" fill="#2CA6A3" opacity="0.15"/>
    <rect x="60" y="280" width="100" height="80" rx="6" fill="#2CA6A3" opacity="0.15"/>
    <rect x="240" y="280" width="100" height="80" rx="6" fill="#2CA6A3" opacity="0.15"/>
  </g>

  <!-- Phone icon -->
  <g transform="translate(140, 550)">
    <rect x="0" y="0" width="140" height="220" rx="20" fill="#142C4A"/>
    <rect x="10" y="20" width="120" height="180" rx="8" fill="#2CA6A3" opacity="0.9"/>
    <line x1="35" y1="50" x2="105" y2="50" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <line x1="35" y1="80" x2="90" y2="80" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <line x1="35" y1="110" x2="105" y2="110" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <circle cx="70" cy="160" r="20" fill="white" opacity="0.3"/>
  </g>

  <!-- Laptop icon -->
  <g transform="translate(680, 560)">
    <rect x="0" y="0" width="200" height="140" rx="8" fill="#142C4A"/>
    <rect x="10" y="10" width="180" height="100" rx="4" fill="#6FE3DF" opacity="0.8"/>
    <rect x="-15" y="140" width="230" height="15" rx="6" fill="#142C4A" opacity="0.7"/>

    <!-- Screen content -->
    <rect x="30" y="30" width="60" height="8" rx="4" fill="white" opacity="0.9"/>
    <rect x="30" y="50" width="140" height="6" rx="3" fill="white" opacity="0.6"/>
    <rect x="30" y="65" width="120" height="6" rx="3" fill="white" opacity="0.6"/>
    <circle cx="155" cy="77" r="18" fill="white" opacity="0.4"/>
  </g>

  <!-- Key icon (imobiliário) -->
  <g transform="translate(420, 650)">
    <circle cx="0" cy="0" r="35" fill="none" stroke="#2CA6A3" stroke-width="8"/>
    <circle cx="0" cy="0" r="15" fill="none" stroke="#2CA6A3" stroke-width="8"/>
    <rect x="20" y="-6" width="120" height="12" rx="6" fill="#2CA6A3"/>
    <rect x="80" y="-20" width="12" height="28" rx="4" fill="#2CA6A3"/>
    <rect x="110" y="-20" width="12" height="28" rx="4" fill="#2CA6A3"/>
  </g>

  <!-- Text overlay effect -->
  <text x="512" y="880" font-family="Space Grotesk, sans-serif" font-size="48" font-weight="700" fill="#142C4A" text-anchor="middle" opacity="0.12">
    SITE PROFISSIONAL
  </text>
  <text x="512" y="940" font-family="Space Grotesk, sans-serif" font-size="36" font-weight="600" fill="#2CA6A3" text-anchor="middle" opacity="0.12">
    PARA CORRETORES
  </text>
</svg>
